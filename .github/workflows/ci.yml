name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: pip install flake8

    - name: Lint Python files
      run: |
        flake8 --max-line-length=100 --ignore=E501,W503 \
          uBCPU/*.py uBDISK/*.py uBNET/*.py uBRES/*.py \
          uBTEMP/*.py uBTIME/*.py uBWEAT/*.py

  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [uBCPU, uBDISK, uBNET, uBRES, uBTEMP, uBTIME, uBWEAT]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Syntax check ${{ matrix.app }}
      run: |
        python -m py_compile ${{ matrix.app }}/*.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck

    - name: Check install scripts
      run: |
        shellcheck -e SC2086 */install.sh */uninstall.sh
